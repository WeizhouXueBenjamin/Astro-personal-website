name: Validate and deploy Astro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialise production builds and deployments; never cancel an active release.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set up project Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Documentation validation
        run: pnpm run verify:ai-docs
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Quality regression tests
        run: pnpm run test:quality
      - name: Documentation regression tests
        run: pnpm run test:ai-docs
      - name: Design token validation
        run: pnpm run verify:design

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install, validate, build and upload
        uses: withastro/action@v6
        with:
          node-version: 22.23.4
          # pnpm version comes from package.json; CI enforces the frozen lockfile.
          build-cmd: pnpm run verify:site && pnpm run build && pnpm run verify:output

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5

sections:
  - id: overview
    title: Overview
    paragraphs:
      - I built this simulation to practise feeder monitoring, supervisory control and fault diagnosis in Ignition Perspective. It combines an operator-facing view with simulated electrical measurements and deterministic control behaviour.
      - My work covered the Tag structure, Perspective bindings and event scripts, control interlocks, command-feedback checking, and alarm activation, acknowledgement and recovery.
  - id: architecture
    title: Architecture & approach
    paragraphs:
      - The application runs within Ignition using a writable default Tag Provider. Commands, Measurements, Status and Simulation are separate Tag groups, keeping operator requests distinct from equipment feedback and fault injection.
      - Perspective presents measurements and status, while event scripts and expression bindings connect the controls to the simulation. The exported close-permissive expression checks remote mode, healthy communications, absence of a protection trip and load below its configured threshold.
    code:
      title: Tag organisation
      language: text
      content: |
        [default]Feeder01
        ├── Commands      Open / close / trip-reset requests
        ├── Measurements  Voltage / current / load / frequency
        ├── Status        Feedback / permissives / alarms
        └── Simulation    Fault switches / targets / timers
    sources:
      - label: Inspect the exported Tags
        url: https://github.com/WeizhouXueBenjamin/distribution-feeder-scada/blob/main/ignition/Feeder01-tags.json
  - id: command-validation
    title: Command-feedback validation
    paragraphs:
      - A button request, an accepted command and breaker feedback represent different stages of an operation. Commands rejected by an interlock do not start the feedback timer because they have not been sent to the simulated device.
      - After a valid command is accepted, the logic waits for the expected breaker feedback. The project documentation describes a timeout of approximately two seconds; missing feedback raises a command-failure alarm.
    significance: Checking feedback separately from command acceptance helps reveal a failed operation instead of treating a button press as proof that the equipment moved.
  - id: protection-recovery
    title: Protection & recovery
    paragraphs:
      - A sustained simulated overload produces a high-load alarm and a delayed protection trip. The trip opens the breaker and prevents another close command until the overload is removed and the trip is reset.
      - Alarm acknowledgement and recovery are separate actions. Acknowledging an alarm records operator attention; removing the fault and restoring the appropriate state allows it to clear. A successful command retry clears the command-failure condition.
    significance: The controls expose the reason an operation is blocked, while the alarm table retains the distinction between active, acknowledged and cleared conditions.
  - id: testing
    title: Testing & validation
    paragraphs:
      - Validation was performed through the Perspective session using simulated operating conditions. The repository records the scenarios below as tested; the linked recording and screenshots document the simulation, not production commissioning or site acceptance.
    tests:
      - scenario: Normal breaker operation
        expected: Close and open requests change breaker feedback and the associated current and load measurements.
        result: The project test record reports successful open and close operation with the expected measurement changes.
        evidence: feeder-demo
      - scenario: Missing command feedback
        expected: An accepted command without matching feedback times out and raises a command-failure alarm.
        result: The supplied screenshot shows FAILED command status and an active, unacknowledged command-failure alarm.
        evidence: command-failure
      - scenario: Sustained overload
        expected: The protection logic trips the breaker and blocks closing until recovery and reset.
        result: The supplied screenshot shows the breaker open, the trip active and the close permissive blocked.
        evidence: overload-trip
      - scenario: Communications loss and interlocks
        expected: Simulated communications loss freezes telemetry and disables control; rejected requests do not create command timeouts.
        result: Both behaviours are recorded as tested in the project README. The recording includes communications-failure simulation; a dedicated interlock trace is not supplied.
        evidence: feeder-demo
      - scenario: Acknowledgement and recovery
        expected: Alarms can be acknowledged, with clearing following recovery; the trip can be reset after overload removal.
        result: Acknowledgement, trip reset and successful retry are recorded as tested in the project README.
    sources:
      - label: Read the project test record
        url: https://github.com/WeizhouXueBenjamin/distribution-feeder-scada#test-scenarios
  - id: outcomes
    title: Outcomes & lessons
    paragraphs:
      - The implemented simulation brings telemetry, breaker supervision, interlocks, feedback checking and alarm handling into one operator view. It provided practical experience separating command intent from observed state and diagnosing fault conditions through Tags and alarms.
      - The model remains a learning environment with simulated equipment. Planned extensions include PLC connectivity through OPC UA, historical trending and operator action records; these are not implemented capabilities of this case study.
